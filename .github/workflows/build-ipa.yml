name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (Xcode 27.1)
    # GitHub's Xcode 27 image (macOS 27). Xcode 27.1 is installed at /Applications/Xcode_27.1.app.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Select Xcode 27.1
        run: |
          if [ ! -d /Applications/Xcode_27.1.app ]; then
            echo "::error::Xcode 27.1 was not found on this runner. Installed versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project DriftMail.xcodeproj \
            -scheme DriftMail \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sort -u || true
          # The .app folder exists even after a failed compile, so check the result line.
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -200 || true

      # The IPA is unsigned, but re-signers such as Feather read the entitlements a
      # binary asks for. Ad hoc sign with DriftMail's entitlements (placeholder team
      # AAAAAAAAAA, which signers replace with yours) so the shared keychain group
      # used by private notifications survives re-signing.
      - name: Embed intended entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/DriftMail.app
          EXT="$APP/PlugIns/NotificationService.appex"
          sed 's/$(AppIdentifierPrefix)/AAAAAAAAAA./g' DriftMail/DriftMail.entitlements > app.entitlements
          sed 's/$(AppIdentifierPrefix)/AAAAAAAAAA./g' NotificationService/NotificationService.entitlements > ext.entitlements
          codesign --force --sign - --timestamp=none --entitlements ext.entitlements "$EXT"
          codesign --force --sign - --timestamp=none --entitlements app.entitlements "$APP"
          codesign -d --entitlements - --xml "$APP" | plutil -p - | head -20

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DriftMail.app Payload/
          zip -qry DriftMail.ipa Payload
          ls -lh DriftMail.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriftMail-ipa
          path: DriftMail.ipa
          if-no-files-found: error

      # Every push to main publishes a release, so AltStore / SideStore
      # (and anyone with the "latest" link) gets updates automatically.
      - name: Write AltStore / SideStore source
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/altstore_source.py "${{ github.repository }}" "$APP_VERSION" "$APP_BUILD" DriftMail.ipa altstore-source.json

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: DriftMail ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Install or update:
            - **AltStore / SideStore:** add the source `https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json` once; new versions then show up as updates.
            - **Sideloadly:** download `DriftMail.ipa` below.
          files: |
            DriftMail.ipa
            altstore-source.json

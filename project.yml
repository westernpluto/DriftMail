name: DriftMail
options:
  bundleIdPrefix: app.driftmail
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Override on the command line to use your own bundle ID (TestFlight workflow does this).
    DRIFT_BUNDLE_ID: app.driftmail.DriftMail
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
targets:
  DriftMail:
    type: application
    platform: iOS
    sources:
      - path: DriftMail
        excludes:
          - Info.plist
      - path: Shared
      # The relay is bundled so the app can deploy it to Cloudflare by itself.
      - path: worker/src/index.js
        buildPhase: resources
    dependencies:
      - target: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DRIFT_BUNDLE_ID)
        PRODUCT_NAME: DriftMail
        INFOPLIST_FILE: DriftMail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DriftMail/DriftMail.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
  # Decrypts end-to-end encrypted notifications on the phone.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
      - path: Shared
      # Mail code reused to fetch the new message's details on the phone.
      - path: DriftMail/Models/Models.swift
      - path: DriftMail/Models/Providers.swift
      - path: DriftMail/Mail/MailSocket.swift
      - path: DriftMail/Mail/IMAPParser.swift
      - path: DriftMail/Mail/IMAPClient.swift
      - path: DriftMail/Mail/MIME.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DRIFT_BUNDLE_ID).NotificationService
        PRODUCT_NAME: NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
